name: Daily AIRSeal Risk Report

on:
  schedule:
    - cron: "0 9 * * *"  # Every day at 9:00 AM UTC
  workflow_dispatch:

jobs:
  daily-airseal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies (if needed)
        run: |
          python -m pip install --upgrade pip

      - name: Generate AIRSeal Risk Report
        run: python3 airseal/engine/generate_risk_report.py

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add airseal/reports/scan_report.md airseal/README.md
          git commit -m "🔄 Daily AIRSeal risk report update [auto]" || echo "No changes to commit"
          git push
