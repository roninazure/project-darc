# .github/workflows/inject-arg-clue.yml

name: 🧩 Auto Inject ARG Clue Drop

on:
  schedule:
    - cron: "0 5 * * *"  # Every day at 05:00 UTC
  workflow_dispatch:

jobs:
  inject-clue-drop:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: 🧱 Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt || true  # In case it's empty

      - name: 🧩 Run clue injection
        run: |
          source .venv/bin/activate
          python .github/scripts/inject_clue_to_readme.py

      - name: 🚀 Commit & Push updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🧩 Auto-inject ARG Clue Drop — $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push origin main
