name: Push Public Feed

on:
  schedule:
    - cron: '0 13 * * *'  # ✅ Daily at 1 PM UTC / 9 AM EDT
  workflow_dispatch:       # ✅ Allow manual trigger
  workflow_run:            # ✅ Auto-run after daily scan
    workflows: ["Daily DARC Scan"]
    types:
      - completed

jobs:
  sync:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repo
        uses: actions/checkout@v3

      - name: 🔐 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DARC_SYNC_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: 🛰️ Run sync script
        run: bash .github/scripts/darc_push_public_feed.sh
