name: Push Public Feed

on:
  schedule:
    - cron: '0 13 * * *'  # Every day at 9 AM EDT / 1 PM UTC
  workflow_dispatch:      # Optional manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repo
        uses: actions/checkout@v3

      - name: 🔐 Set SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DARC_SYNC_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: 🛰️ Run sync script
        run: bash .github/scripts/darc_push_public_feed.sh
