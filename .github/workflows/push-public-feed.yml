name: Push Public Feed

on:
  schedule:
    - cron: '0 13 * * *'  # Every day at 9 AM EDT / 1 PM UTC
  workflow_dispatch:      # Optional manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repo
        uses: actions/checkout@v3

      - name: 🔐 Create SSH Key File
        run: |
          echo "${{ secrets.DARC_SYNC_KEY }}" > testkey
          chmod 600 testkey

      - name: 🛰️ Run sync script
        run: bash .github/scripts/darc_push_public_feed.sh
