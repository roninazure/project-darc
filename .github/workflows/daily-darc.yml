name: Daily DARC Recon

on:
  schedule:
    - cron: '0 13 * * *'  # Every day at 9 AM EDT / 1 PM UTC
  workflow_dispatch:      # Optional manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repo
        uses: actions/checkout@v3

      - name: 🛰️ Run DARC Scan
        run: python3 .github/scripts/darc_scan.py

      - name: 🚀 Push README update
        run: |
          git config user.name "CodexDaemon"
          git config user.email "roninazure@gmail.com"
          git add README.md mad-log/
          git commit -m "🛰️ D.A.R.C. auto-scan update [$(date -u)]" || echo "Nothing to commit."
          git push
