name: Daily DARC Recon

on:
  schedule:
    - cron: '0 13 * * *'  # 9 AM EDT / 1 PM UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repo
        uses: actions/checkout@v3

      - name: 🛰️ Run DARC Scan
        run: python3 .github/scripts/darc_scan.py

      - name: 🚀 Push README update
        run: |
          git config user.name "CodexDaemon"
          git config user.email "roninazure@gmail.com"
          git add README.md mad-log/
          git commit -m "🛰️ D.A.R.C. auto-scan update [$(date -u)]" || echo "Nothing to commit."
          git push

      - name: 🔐 Setup SSH Key for public sync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DARC_SYNC_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: 🛰️ Sync README to Public Feed
        run: bash .github/scripts/darc_push_public_feed.sh
