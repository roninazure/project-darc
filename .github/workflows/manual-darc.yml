name: Manual D.A.R.C. Scan

on:
  workflow_dispatch:

jobs:
  darc-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || true  # Skip if no dependencies

    - name: Run D.A.R.C. scan
      run: |
        python .github/scripts/darc_scan.py

    - name: Commit and push changes
      run: |
        git config user.name "CodexDaemon"
        git config user.email "roninazure@gmail.com"
        git add mad-log/*.md
        git commit -m "🔍 D.A.R.C. scan on $(date +'%Y-%m-%d')" || echo "No changes to commit"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
